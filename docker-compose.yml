services:
  ticket-triage:
    build: .
    container_name: agentic-ticket-triage

    ports:
      - "8000:8000"

    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      LOG_LEVEL: INFO
      DATABASE_PATH: /app/data/tickets.db

    volumes:
      - ./data:/app/data

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
